# ══════════════════════════════════════════════════════════
# CI — Senlis Participatif
# Lint + tests sur chaque push et PR.
# CI verte = condition de merge (protection de branche).
# ══════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# S5R2-08 partie 3 (OWASP A08 — intégrité, moindre privilège) : le jeton
# GitHub prêté à chaque exécution peut seulement LIRE le code. Sans ce
# bloc, il reçoit les droits par défaut du dépôt (parfois l'écriture) :
# une dépendance piégée exécutée pendant `npm ci` pourrait alors pousser
# du code ou modifier une release. La CI ne fait que lire et tester.
permissions:
  contents: read

jobs:
  # ── API ──────────────────────────────────────────────
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: senlis
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: senlis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U senlis"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://senlis:test_password@localhost:5432/senlis_test
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test

  # ── Client ───────────────────────────────────────────
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ── Dépendances vulnérables (S5A-08 — OWASP A03:2025, chaîne
  # d'approvisionnement logicielle ; A06 dans l'édition 2021) ─────
  # Un projet moderne embarque des centaines de paquets écrits par
  # d'autres. `npm audit` compare leurs versions à la base publique des
  # failles connues. Analogie : le rappel de produits d'un fabricant
  # automobile — on vérifie si NOTRE voiture est concernée.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # BLOQUANT dès le niveau « élevé » dans ce qui part en production
      # (--omit=dev : les outils de test ne sont pas livrés).
      # S5R2-08 partie 3 : relevé de « critique » à « élevé ». La
      # tolérance venait des failles de l'outillage Prisma 7.8, toutes
      # corrigées depuis (npm audit à 0 le 23/11/2026). Si une faille
      # élevée apparaît sans correctif : `overrides` dans le package.json
      # racine (exemple : effect), ou décision écrite au document 21.
      - name: Audit bloquant (élevé et critique)
        run: npm audit --omit=dev --audit-level=high
      # INFORMATIF : tout le reste (modéré, faible, outils de dev compris)
      - name: Audit informatif (tout)
        run: npm audit
        continue-on-error: true

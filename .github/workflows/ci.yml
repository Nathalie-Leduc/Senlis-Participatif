# ══════════════════════════════════════════════════════════
# CI — Senlis Participatif
# Lint + tests sur chaque push et PR.
# CI verte = condition de merge (protection de branche).
# ══════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ── API ──────────────────────────────────────────────
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: senlis
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: senlis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U senlis"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://senlis:test_password@localhost:5432/senlis_test
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test

  # ── Client ───────────────────────────────────────────
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ── Dépendances vulnérables (S5A-08 — OWASP A06) ─────
  # Un projet moderne embarque des centaines de paquets écrits par
  # d'autres. `npm audit` compare leurs versions à la base publique des
  # failles connues. Analogie : le rappel de produits d'un fabricant
  # automobile — on vérifie si NOTRE voiture est concernée.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # BLOQUANT : aucune faille « critique » dans ce qui part en
      # production (--omit=dev : les outils de test ne sont pas livrés).
      - name: Audit bloquant (critique)
        run: npm audit --omit=dev --audit-level=critical
      # INFORMATIF : les failles « élevées » sont affichées sans bloquer.
      # Au 28/09/2026, elles viennent toutes de l'outillage de la CLI
      # Prisma 7.8 (@prisma/dev, mysql2, deepmerge-ts…), jamais exécuté
      # par l'API en fonctionnement ; seule « correction » proposée :
      # redescendre en Prisma 6. Dependabot proposera la mise à jour
      # dès que Prisma publiera un correctif.
      - name: Audit informatif (élevé)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

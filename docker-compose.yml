# ══════════════════════════════════════════════════════════════
# Senlis Participatif — docker-compose.yml (DÉVELOPPEMENT)
#
#   docker compose up -d postgres   → la base seule (usage courant :
#                                     l'API tourne avec `npm run dev`)
#   docker compose up -d            → la base + l'API en conteneur
#
# Le client React tourne via `npm run dev` hors Docker (Vite HMR).
# La production (Clever Cloud) n'utilise pas ce fichier.
# ══════════════════════════════════════════════════════════════

services:
  # ── Base de données ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: senlis-db
    restart: unless-stopped
    ports:
      # 127.0.0.1 : la base n'écoute QUE sur ta machine (S5A-08).
      # Sans ce préfixe, Docker l'ouvre sur toutes les interfaces
      # réseau : n'importe qui sur le même Wi-Fi (école, café…)
      # pouvait tenter de s'y connecter avec ce mot de passe de dev.
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: senlis
      POSTGRES_PASSWORD: senlis_dev_password
      POSTGRES_DB: senlis_participatif
    volumes:
      # Les données survivent au `docker compose down` (pas au `down -v`)
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U senlis -d senlis_participatif']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API Express ──────────────────────────────────────────────
  api:
    build:
      # Contexte = racine : le lockfile unique du monorepo y vit
      context: .
      dockerfile: api/Dockerfile
    container_name: senlis-api
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    # Même .env que `npm run dev` (JWT_SECRET, SMTP Mailtrap…) : sans
    # lui, validateEnv.js refusait de démarrer (JWT_SECRET manquant).
    env_file: ./api/.env
    environment:
      # …sauf l'adresse de la base : dans Docker, « localhost » désigne
      # le conteneur de l'API lui-même — la base s'appelle « postgres ».
      DATABASE_URL: postgresql://senlis:senlis_dev_password@postgres:5432/senlis_participatif
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Code monté pour voir ses modifications sans reconstruire l'image
      # (redémarrer le conteneur : docker compose restart api)
      - ./api/src:/app/api/src
      # …sauf le client Prisma généré DANS l'image, que le montage
      # ci-dessus masquerait sinon (volume anonyme = « garde celui de l'image »)
      - /app/api/src/generated
      - uploads:/app/api/uploads

volumes:
  pgdata:
  uploads:
